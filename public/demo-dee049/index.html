<!doctype html>
<html lang="fr">
<head>
  <base href="/demo-dee049/" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <title>VIA — Accès à la démo</title>
  <style>
    :root{
      --violet:#7856FF; --violet-d:#5b3fd6; --bg:#F5F3F7;
      --ink:#241033; --muted:#6b6580; --line:#e6e1ef; --err:#d4456b;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:radial-gradient(1200px 600px at 50% -10%, #efe9ff 0%, var(--bg) 55%);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .card{
      width:100%; max-width:430px; background:#fff; border:1px solid var(--line);
      border-radius:18px; padding:34px 34px 26px;
      box-shadow:0 20px 60px -20px rgba(88,63,214,.28);
    }
    .logo{display:block; height:62px; margin:0 auto 18px}
    h1{font-size:1.22rem; margin:0 0 6px; text-align:center; letter-spacing:-.01em}
    .sub{font-size:.86rem; color:var(--muted); text-align:center; margin:0 0 24px; line-height:1.5}
    label{display:block; font-size:.72rem; font-weight:600; text-transform:uppercase;
      letter-spacing:.06em; color:var(--muted); margin:0 0 6px}
    .field{margin-bottom:14px}
    .row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
    input{
      width:100%; padding:12px 14px; font-size:.95rem; border:1px solid var(--line);
      border-radius:11px; background:#fbfaff; color:var(--ink); outline:none; transition:.15s;
    }
    input:focus{border-color:var(--violet); background:#fff; box-shadow:0 0 0 3px rgba(120,86,255,.15)}
    button{
      width:100%; margin-top:8px; padding:13px; font-size:.95rem; font-weight:600;
      color:#fff; background:var(--violet); border:none; border-radius:11px; cursor:pointer; transition:.15s;
    }
    button:hover{background:var(--violet-d)}
    button:disabled{opacity:.6; cursor:default}
    .err{color:var(--err); font-size:.82rem; min-height:1.1em; margin:6px 2px 0; text-align:center}
    .cobrand{
      margin-top:22px; padding-top:18px; border-top:1px solid var(--line);
      display:flex; flex-direction:column; align-items:center; gap:8px;
    }
    .cobrand-kicker{font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
    .cobrand img{height:20px; opacity:.92}
    .foot{margin-top:14px; font-size:.72rem; color:var(--muted); text-align:center; line-height:1.5}
    .lock{display:inline-block; vertical-align:-1px; margin-right:4px}
    .consent{display:flex; gap:9px; align-items:flex-start; margin:2px 2px 14px; cursor:pointer; text-align:left}
    .consent input{margin-top:2px; width:16px; height:16px; accent-color:var(--violet); flex-shrink:0; cursor:pointer}
    .consent span{font-size:.72rem; color:var(--muted); line-height:1.5}
  </style>
</head>
<body>
  <form class="card" id="gate" autocomplete="off">
    <img class="logo" src="./via-logo.png" alt="VIA" />
    <h1>Accès à la démonstration</h1>
    <p class="sub">Identifiez-vous pour accéder à la démo. Renseignez vos coordonnées et la clé d'accès qui vous a été communiquée.</p>

    <div class="row">
      <div class="field">
        <label for="prenom">Prénom</label>
        <input id="prenom" name="prenom" type="text" required placeholder="Prénom" />
      </div>
      <div class="field">
        <label for="nom">Nom</label>
        <input id="nom" name="nom" type="text" required placeholder="Nom" />
      </div>
    </div>
    <div class="field">
      <label for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email" required placeholder="vous@entreprise.com" />
    </div>
    <div class="field">
      <label for="entreprise">Entreprise</label>
      <input id="entreprise" name="entreprise" type="text" required placeholder="Votre organisation" />
    </div>
    <div class="field">
      <label for="pwd">Clé d'accès</label>
      <input id="pwd" name="pwd" type="password" required placeholder="••••••••" />
    </div>

    <label class="consent">
      <input type="checkbox" id="consent" />
      <span>J'accepte que VIA enregistre mes informations (nom, prénom, courriel, entreprise) ainsi que des données techniques de connexion, afin de gérer et sécuriser l'accès à cette démonstration. Ces données ne sont pas partagées avec des tiers.</span>
    </label>

    <button type="submit" id="btn">Entrer →</button>
    <div class="err" id="err"></div>

    <div class="cobrand">
      <span class="cobrand-kicker">Démo préparée pour</span>
      <img src="./descair.png" alt="Descair" />
    </div>
    <p class="foot"><span class="lock">🔒</span>Accès réservé. Sans identifiants, contactez VIA.</p>
  </form>

  <script>
    // Clé d'accès → clé AES-256 via PBKDF2 (250 000 itérations, sel fixe).
    // La clé d'accès n'est jamais stockée ; la clé dérivée déchiffre les données de la démo.
    const SALT = new Uint8Array([14,19,47,130,101,206,93,37,116,17,74,190,160,134,139,11]);
    const ITER = 250000;
    const FORMSPREE = "https://formspree.io/f/mwvwnalv";

    const form = document.getElementById('gate');
    const errEl = document.getElementById('err');
    const btn = document.getElementById('btn');

    async function deriveKey(pwd){
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name:'PBKDF2', salt:SALT, iterations:ITER, hash:'SHA-256' },
        base, { name:'AES-GCM', length:256 }, true, ['decrypt']
      );
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      const prenom = document.getElementById('prenom').value.trim();
      const nom    = document.getElementById('nom').value.trim();
      const email  = document.getElementById('email').value.trim();
      const entreprise = document.getElementById('entreprise').value.trim();
      const pwd    = document.getElementById('pwd').value;
      const consent = document.getElementById('consent').checked;
      if (!prenom || !nom || !email || !entreprise || !pwd) return;
      if (!consent){ errEl.textContent = 'Veuillez accepter les conditions pour continuer.'; return; }

      btn.disabled = true; btn.textContent = 'Vérification…';

      // Dérive la clé puis vérifie la clé d'accès en déchiffrant un témoin.
      let key;
      try {
        key = await deriveKey(pwd);
        const res = await fetch('./verifier.enc', { cache: 'no-store' });
        if (!res.ok) throw new Error('verifier');
        const buf = new Uint8Array(await res.arrayBuffer());
        await crypto.subtle.decrypt({ name:'AES-GCM', iv: buf.slice(0,12) }, key, buf.slice(12));
      } catch (_) {
        errEl.textContent = 'Coordonnées ou clé d\'accès incorrects.';
        btn.disabled = false; btn.textContent = 'Entrer →';
        return;
      }

      // Clé d'accès correcte → exporter la clé (pour déchiffrer la démo), notifier VIA, ouvrir.
      const raw = await crypto.subtle.exportKey('raw', key);
      const keyB64 = btoa(String.fromCharCode(...new Uint8Array(raw)));
      try {
        await fetch(FORMSPREE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            prenom: prenom,
            nom: nom,
            email: email,
            entreprise: entreprise,
            consentement: 'Accepté',
            _subject: 'Connexion démo VIA — ' + prenom + ' ' + nom + ' (' + entreprise + ')',
            message: 'Accès démo VIA\n'
              + 'Nom : ' + nom + '\nPrénom : ' + prenom
              + '\nEntreprise : ' + entreprise
              + '\nE-mail : ' + email
              + '\nConsentement : accepté'
              + '\nDate : ' + new Date().toLocaleString('fr-CA')
              + '\nFuseau : ' + (Intl.DateTimeFormat().resolvedOptions().timeZone || '?')
              + '\nLangue : ' + (navigator.language || '?')
              + '\nÉcran : ' + screen.width + '×' + screen.height
              + '\nNavigateur : ' + navigator.userAgent
          })
        });
      } catch (_) { /* best-effort : on ouvre quand même */ }

      sessionStorage.setItem('via_key', keyB64);
      sessionStorage.setItem('via_gate_ok', '1');
      location.assign('./demo/');
    });
  </script>
</body>
</html>
